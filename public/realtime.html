<!DOCTYPE html>
<html lang="en">
<head>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
<script src="https://d3js.org/d3.v6.js"></script>
<link rel="stylesheet" href="style.css">
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://unpkg.com/@headlessui/react@latest"></script>

<script src="https://unpkg.com/leaflet-omnivore@0.3.4/leaflet-omnivore.min.js"></script>

<!-- NCAR Design System -->
<link rel="stylesheet" href="css/design-tokens.css">
<link rel="stylesheet" href="css/responsive-grid.css">

</head>
<header id="NavBar"></header>
<body>
    
    
    <div id="flight-header">
        <!-- Flight Select -->
        <div class="header-label" id="flight-select-container">
            <!-- Time Select -->
            <div>
                <label for="time-select" class="font1">Time Range</label>
                <select id="time-select" class="font2"></select>
            </div>
        </div>

        <!-- Project Select -->
        <div class="header-label">
            <label for="project-select" class="font1">CGWaveS</label>
        </div>

        <!-- Buttons for Share, Download, and Cite -->
        <div class="header-label flex justify-end space-x-4 share-download-cite">
            <button class="icon-button" title="Share">
                <i class="fas fa-share-alt text-gray-600"></i>
                <span class="sr-only">Share</span>
            </button>
            <button class="icon-button" title="Download">
                <i class="fas fa-download text-gray-600"></i>
                <span class="sr-only">Download</span>
            </button>
            <button class="icon-button" title="Cite">
                <i class="fas fa-quote-right text-gray-600"></i>
                <span class="sr-only">Cite</span>
            </button>
        </div>
    </div>
    <div class="realtime-grid">
         <!-- Map Section -->
        <div>
            <div class="card border rounded shadow-lg p-4" id="map-card">
                <!-- Card Header -->
                <div class="flex-between mb-4 draggable-header">
                    <div class="flex-center">
                        <img src="icons/drag-handle.svg" alt="Drag" class="draggable-icon" title="Drag" style="height: 1em; vertical-align: middle;">
                        <h3 class="text-lg font-bold ml-2">Flight Map</h3>
                    </div>
                    <div class="flex-row space-x-2">
                        <button class="icon-button" title="Download">
                            <i class="fas fa-download"></i>
                        </button>
                        <button class="icon-button" title="Share">
                            <i class="fas fa-share-alt"></i>
                        </button>
                        <button class="icon-button" title="Settings">
                            <i class="fas fa-cog"></i>
                        </button>
                    </div>
                </div>
                            <!-- Card Content -->
                <div id="map">
                </div>
            </div>
        </div>

        <div>
            <div class="card border rounded shadow-lg p-4" id="charts-card">
                <!-- Card Header -->
            <div class="flex-between mb-4">
                <h3 class="text-lg font-bold">Charts</h3>
                <div class="flex-row space-x-2">
                    <button class="icon-button" title="Download">
                        <i class="fas fa-download"></i>
                    </button>
                    <button class="icon-button" title="Share">
                        <i class="fas fa-share-alt"></i>
                    </button>
                    <button class="icon-button" title="Settings">
                        <i class="fas fa-cog"></i>
                    </button>
                </div>
            </div>
            <!-- Card Content -->
            <div id="charts-container">
                <div id="graph-container" class="grid">
                    <div id="chart1"></div>
                    <div id="chart2"></div>
                    <div id="chart3"></div>
                    <div id="chart4"></div>
                </div>
            </div>
            </div>
        </div>
                <div id="image-container" style = "display: none;">
                    <div id="F2DS"> </div>
                    <div id="HVPS"> </div>
                </div>        
        

</div>
<footer id="footer"></footer>
<script type="module" src="modules/components.js"></script>
<script type = "module" src="realtime.js"></script>
</body>

</html>
