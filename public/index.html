<!DOCTYPE html>
<html lang="en">
<head>
<base href="/aircraft/">
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAF Flight Data Visualizer</title>

<!-- External Libraries -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
<script src="https://d3js.org/d3.v6.js"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<script src="https://unpkg.com/maplibre-gl@^5.17.0/dist/maplibre-gl.js"></script>
<link href="https://unpkg.com/maplibre-gl@^5.17.0/dist/maplibre-gl.css" rel="stylesheet" />
<script src="
https://cdn.jsdelivr.net/npm/deck.gl@9.2.6/dist.min.js
"></script>
<link href="
https://cdn.jsdelivr.net/npm/deck.gl@9.2.6/dist/stylesheet.min.css
" rel="stylesheet">
<!-- Google Fonts: Poppins, Inter, Cormorant -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&family=Inter:wght@700&family=Cormorant:wght@500&display=swap" rel="stylesheet">

<!-- NCAR Design System - Core CSS (always loaded) -->
<link rel="stylesheet" href="style.css">

</head>
<body>

<!-- Header loaded from navbar.html -->
<div id="NavBar"></div>

<!-- SPA Content Area - Pages loaded dynamically here -->
<div id="content-area">
    <!-- Loading indicator shown while page loads -->
    <div class="spa-loading" id="spa-loading">
        <div class="loading-spinner"></div>
        <p>Loading...</p>
    </div>
</div>

<!-- Footer loaded from footer.html -->
<footer class="site-footer"></footer>

<!-- Components loader -->
<script src="modules/components/components.js"></script>

<!-- Fullscreen overlay (shared across pages) -->
<script type="module" src="modules/FullscreenOverlay.js"></script>

<!-- SPA Entry Point -->
<script type="module" src="app.js"></script>

<!-- Navbar SPA handler -->
<script src="navbar.js"></script>

<style>
/* SPA Loading Indicator */
.spa-loading {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 50vh;
    color: var(--text-secondary, #666);
}

.loading-spinner {
    width: 40px;
    height: 40px;
    border: 3px solid var(--border-color, #e0e0e0);
    border-top-color: var(--primary-color, #1A658F);
    border-radius: 50%;
    animation: spin 1s linear infinite;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

/* Hide loading indicator when content is loaded */
#content-area:not(:empty) .spa-loading {
    display: none;
}

/* Ensure content area has proper layout */
#content-area {
    min-height: calc(100vh - 200px);
}

#content-area > main {
    animation: fadeIn 0.2s ease-out;
}

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}
</style>

</body>
</html>
