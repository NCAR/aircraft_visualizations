<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAF Flight Data Visualizer</title>

<!-- External Libraries -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
<script src="https://d3js.org/d3.v6.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-omnivore@0.3.4/leaflet-omnivore.min.js"></script>

<!-- Google Fonts: Poppins, Inter, Cormorant -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&family=Inter:wght@700&family=Cormorant:wght@500&display=swap" rel="stylesheet">

<!-- NCAR Design System -->
<link rel="stylesheet" href="css/design-tokens.css">
<link rel="stylesheet" href="css/responsive-grid.css">
<link rel="stylesheet" href="css/settings-overlay.css">
<link rel="stylesheet" href="style.css">

</head>
<body>

<!-- Header loaded from navbar.html -->
<div id="NavBar"></div>

<!-- Main Content -->
<main class="main-content">
    <!-- Top Controls Section -->
    <div class="top-controls">
        <div class="controls-left">
            <!-- Flight Selector - Custom Dropdown -->
            <div class="custom-dropdown" id="flight-dropdown">
                <button class="custom-dropdown-trigger" id="flight-trigger">
                    <span class="dropdown-text">Select Flight</span>
                    <svg class="dropdown-arrow" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
                </button>
                <div class="custom-dropdown-menu" id="flight-menu">
                    <!-- Options populated by main.js -->
                </div>
            </div>
        </div>
        
        <!-- Project Selector - Custom Dropdown -->
        <div class="project-dropdown" id="project-dropdown">
            <button class="project-dropdown-trigger" id="project-trigger">
                <span class="dropdown-text">Select Project</span>
                <svg class="project-dropdown-arrow" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
            </button>
            <div class="project-dropdown-menu" id="project-menu">
                <!-- Options populated by main.js -->
            </div>
        </div>
        
        <!-- Action Buttons-- not ready yet-->
        <!-- <div class="action-buttons">
            <button class="action-btn">
                <i class="fas fa-share-alt"></i>
                <span>SHARE</span>
            </button>
            <button class="action-btn">
                <i class="fas fa-download"></i>
                <span>DOWNLOAD</span>
            </button>
            <button class="action-btn">
                <i class="fas fa-quote-right"></i>
                <span>CITE</span>
            </button>
        </div> -->
    </div>
    

    <!-- Timeline Controls - Spans full width -->
    <div id="timeline-bar">
        <div id="timeline-controls">
            <button id="play-pause-button">▶</button>
            <div id="timeline-wrapper">
                <span id="current-time-display">00:00:00</span>
                <div id="timeline-container">
                    <input type="range" id="time-slider" min="0" max="1000" value="0" step="1">
                    <div id="timeline-progress"></div>
                    <div id="timeline-center-line"></div>
                    <div id="timeline-ticks"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Visualization Grid -->
    <div class="viz-grid">
        <!-- Camera Imagery Card -->
        <div class="viz-card camera-card">
            <div class="card-header">
                <div class="card-title-group">
                    <button class="drag-handle" title="Drag to reorder">
                        <img src="icons/drag-handle.svg" alt="Drag to reorder" class="drag-handle-icon">
                    </button>
                    <div class="card-title-info">
                        <h3 class="card-title">Camera Imagery</h3>
                    </div>
                </div>
                <div class="card-actions">
                    <button class="icon-btn" title="Share">
                        <i class="fas fa-share-alt"></i>
                    </button>
                    <button class="icon-btn" title="Download">
                        <i class="fas fa-download"></i>
                    </button>
                    <button class="icon-btn" title="Settings">
                        <i class="fas fa-cog"></i>
                    </button>
                </div>
            </div>
            <div class="card-content video-content">
                <button class="expand-btn expand-overlay" title="Expand view">
                    <i class="fas fa-expand"></i>
                </button>
                <video id="myVideo">
                    <source src="movies/2" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
            </div>
        </div>

        <!-- Plots Card -->
        <div class="viz-card plots-card">
            <div class="card-header">
                <div class="card-title-group">
                    <button class="drag-handle" title="Drag to reorder">
                        <i class="fas fa-grip-vertical"></i>
                    </button>
                    <div class="card-title-info">
                        <h3 class="card-title">Plots</h3>
                    </div>
                </div>
                <div class="card-actions">
                    <button class="icon-btn" title="Share">
                        <i class="fas fa-share-alt"></i>
                    </button>
                    <button class="icon-btn" title="Download">
                        <i class="fas fa-download"></i>
                    </button>
                    <button class="icon-btn" title="Settings" id="open-settings-btn">
                        <i class="fas fa-cog"></i>
                    </button>
                </div>
            </div>
            <div class="card-content charts-content">
                <button class="expand-btn expand-overlay" title="Expand view">
                    <i class="fas fa-expand"></i>
                </button>
                <div id="graph-container" class="charts-grid" data-chart-count="4">
                    <!-- Charts are dynamically created by ChartContainerManager -->
                </div>
            </div>
        </div>

        <!-- Flight Map Card -->
        <div class="viz-card map-card">
            <div class="card-header">
                <div class="card-title-group">
                    <button class="drag-handle" title="Drag to reorder">
                        <i class="fas fa-grip-vertical"></i>
                    </button>
                    <div class="card-title-info">
                        <h3 class="card-title">Flight Map</h3>
                    </div>
                </div>
                <div class="card-actions">
                    <button class="icon-btn" title="Share">
                        <i class="fas fa-share-alt"></i>
                    </button>
                    <button class="icon-btn" title="Download">
                        <i class="fas fa-download"></i>
                    </button>
                    <button class="icon-btn" title="Settings">
                        <i class="fas fa-cog"></i>
                    </button>
                </div>
            </div>
            <div class="card-content map-content">
                <button class="expand-btn expand-overlay" title="Expand view">
                    <i class="fas fa-expand"></i>
                </button>
                <div id="map"></div>
            </div>
        </div>
        
        <!-- Variable Selector (Hidden) -->
        <div style="display: none;">
            <select id="variable-select"></select>
        </div>
        
        <!-- Image Container (Hidden) -->
        <div id="image-container" style="display: none;">
            <div id="F2DS"></div>
            <div id="HVPS"></div>
        </div>
    </div>
</main>

<!-- Footer loaded from footer.html -->
<footer class="site-footer"></footer>
<script src="modules/components/components.js"></script>

<!-- Store-connected version - no need for chartselect.js -->
<script type = "module" src="main.js"></script>
</body>

</html>
