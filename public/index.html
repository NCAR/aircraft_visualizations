<!DOCTYPE html>
<html lang="en">
<head>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
<script src="https://d3js.org/d3.v6.js"></script>
<link rel="stylesheet" href="style.css">
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://unpkg.com/@headlessui/react@latest"></script>

<script src="https://unpkg.com/leaflet-omnivore@0.3.4/leaflet-omnivore.min.js"></script>

<!-- Google Fonts: Poppins -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">

<!-- NCAR Design System -->
<link rel="stylesheet" href="css/design-tokens.css">
<link rel="stylesheet" href="css/responsive-grid.css">

</head>
<header id="NavBar"></header>
<body>
    
    
    <div id="flight-header">
        <!-- Flight Select -->
        <div class="header-label" id="flight-select-container">
            <div>
                <label for="flight-select" class="font1">Flight:</label>
                <select id="flight-select" class="font2"></select>
            </div>
            <!-- Time Select
            <div>
                <label for="time-select" class="font1">Time Range</label>
                <select id="time-select" class="font2"></select>
            </div> -->
        </div>
    <!-- VARIABLE Select -->
        <div class="header-label">
            <select id="variable-select" class="font2"></select>
        </div>
        <!-- Project Select -->
        <div class="header-label">
            <select id="project-select" class="font2"></select>
        </div>
    </div>
    
    <!-- Timeline Controls - Spans full width -->
    <div id="timeline-bar">
        <div id="timeline-controls">
            <button id="play-pause-button">▶</button>
            <div id="timeline-wrapper">
                <span id="current-time-display">00:00:00</span>
                <div id="timeline-container">
                    <input type="range" id="time-slider" min="0" max="1000" value="0" step="1">
                    <div id="timeline-progress"></div>
                    <div id="timeline-ticks"></div>
                </div>
                
            </div>
        </div>
    </div>

    <div class="viz-grid">
         <!-- Map Section -->
        <div class="map-section">
            <div class="card border rounded shadow-lg p-4" id="map-card">
                <!-- Card Header -->
                <div class="flex-between mb-4 draggable-header">
                    <div class="flex-center">
                        <img src="icons/drag-handle.svg" alt="Drag" class="draggable-icon" title="Drag" style="height: 1em; vertical-align: middle;">
                        <h3 class="text-lg font-bold ml-2">Flight Map</h3>
                    </div>
                    <div class="flex-row space-x-2">
                        <button class="icon-button" title="Download">
                            <i class="fas fa-download"></i>
                        </button>
                        <button class="icon-button" title="Share">
                            <i class="fas fa-share-alt"></i>
                        </button>
                        <button class="icon-button" title="Settings">
                            <i class="fas fa-cog"></i>
                        </button>
                    </div>
                </div>
                            <!-- Card Content -->
                <div id="map">
                </div>
            </div>
        </div>
        <!-- Video Section -->
    <div class="video-section" id="video-card">
        <div class="card border rounded shadow-lg p-4">
            <!-- Card Header -->
            <div class="flex-between mb-4 draggable-header">
                <div class="flex-center">
                    <img src="icons/drag-handle.svg" alt="Drag" class="draggable-icon" title="Drag" style="height: 1em; vertical-align: middle;">
                    <h3 class="text-lg font-bold ml-2">Camera Imagery</h3>
                </div>
                <div class="flex-row space-x-2">
                    <button class="icon-button" title="Download">
                        <i class="fas fa-download"></i>
                    </button>
                    <button class="icon-button" title="Share">
                        <i class="fas fa-share-alt"></i>
                    </button>
                    <button class="icon-button" title="Settings">
                        <i class="fas fa-cog"></i>
                    </button>
                </div>
            </div>
                <!-- Card Content -->
                <div id="video-card">
                    <video id="myVideo"> 
                        <!-- remove controls. video controlled from timeline -->
                        <source src="movies/2" type="video/mp4">
                        Your browser does not support the video tag.
                    </video>
                </div>
                
            </div>
        </div>

    <div class="charts-section">
        <div class="card border rounded shadow-lg p-4" id="charts-card">
            <!-- Card Header -->
            <div class="flex-between mb-4 draggable-header">
                <div class="flex-center">
                    <img src="icons/drag-handle.svg" alt="Drag" class="draggable-icon" title="Drag" style="height: 1em; vertical-align: middle;">
                    <h3 class="text-lg font-bold ml-2">Charts</h3>
                </div>
                <div class="flex-row space-x-2">
                    <button class="icon-button" title="Download">
                        <i class="fas fa-download"></i>
                    </button>
                    <button class="icon-button" title="Share">
                        <i class="fas fa-share-alt"></i>
                    </button>
                    <button class="icon-button" title="Settings">
                        <i class="fas fa-cog"></i>
                    </button>
                </div>
            </div>
            <!-- Card Content -->
            <div id="charts-container">
                <div id="graph-container" class="grid">
                    <div id="chart1"></div>
                    <div id="chart2"></div>
                    <div id="chart3"></div>
                    <div id="chart4"></div>
                </div>
            </div>
            </div>
        </div>
                <div id="image-container" style = "display: none;">
                    <div id="F2DS"> </div>
                    <div id="HVPS"> </div>
                </div>        
        

</div>
<footer id="footer"></footer>
<script type="module" src="modules/components.js"></script>
<!-- Store-connected version - no need for chartselect.js -->
<script type = "module" src="main.js"></script>
</body>

</html>
