<!-- Realtime Page Partial -->
<main class="realtime-page">
    <!-- Top Controls -->
    <div class="realtime-controls">
        <div class="controls-left">
            <!-- Database Toggle -->
            <div class="database-toggle">
                <label class="toggle-label">Aircraft:</label>
                <div class="toggle-buttons" id="database-toggle">
                    <button class="toggle-btn active" data-db="C130">C-130</button>
                    <button class="toggle-btn" data-db="GV">GV</button>
                </div>
                <span class="flight-status-badge" id="flight-status-badge" style="display:none"></span>
            </div>
        </div>

        <div class="controls-center">
            <h2 class="page-title">Real-Time Flight Data</h2>
            <span class="data-date" id="data-date"></span>
            <div class="connection-status" id="connection-status">
                <span class="status-dot"></span>
                <span class="status-text">Connecting...</span>
            </div>
        </div>

        <div class="controls-right">
            <!-- Pause Sync (debug) -->
            <button type="button" class="btn btn-secondary" id="pause-sync-btn" title="Pause incoming SSE data (debug)">
                <i class="fas fa-pause"></i> Pause Sync
            </button>
            <!-- Review Mode Toggle -->
            <button type="button" class="btn btn-secondary" id="review-mode-btn">
                <i class="fas fa-history"></i> Review
            </button>
            <!-- Fetch Button (manual refresh if needed) -->
            <button type="button" class="btn btn-primary" id="fetch-data-btn">
                <i class="fas fa-sync-alt"></i> Refresh
            </button>
        </div>
    </div>

    <!-- Review Mode Panel -->
    <div id="review-panel" class="review-panel" style="display:none">
        <div class="review-header">
            <span class="review-label">Review Mode</span>
            <span id="review-current-time" class="review-current-time">--:--:--</span>
            <button type="button" class="btn btn-secondary btn-sm" id="exit-review-btn">Exit Review</button>
        </div>
        <div class="review-scrubber-row">
            <span id="review-start-label" class="review-time-label">--:--</span>
            <input type="range" id="review-scrubber" class="review-scrubber" min="0" max="1000" value="1000">
            <span id="review-end-label" class="review-time-label">--:--</span>
        </div>
    </div>

    <!-- Stale Data Banner -->
    <div id="stale-data-banner" class="stale-banner" style="display:none">
        <i class="fas fa-exclamation-triangle"></i>
        <span id="stale-banner-text"></span>
    </div>

    <!-- Main Content Grid -->
    <div class="realtime-grid">
        <!-- Map Card -->
        <div class="viz-card realtime-map-card">
            <div class="card-header">
                <div class="card-title-group">
                    <h3 class="card-title">Flight Track</h3>
                </div>
                <div class="card-actions">
                    <button class="icon-btn" id="realtime-map-settings-btn" title="Settings">
                        <i class="fas fa-sliders-h"></i>
                    </button>
                </div>
            </div>
            <div class="card-content map-content">
                <div id="realtime-map"></div>
            </div>
        </div>

        <!-- Charts Card -->
        <div class="viz-card realtime-chart-card">
            <div class="card-header">
                <div class="card-title-group">
                    <h3 class="card-title">Time Series</h3>
                    <span class="data-info" id="data-info">No data loaded</span>
                    <div class="time-window-toggle" id="time-window-toggle">
                        <button class="time-window-btn active" data-window="all">All</button>
                        <button class="time-window-btn" data-window="5">5m</button>
                        <button class="time-window-btn" data-window="30">30m</button>
                        <button class="time-window-btn" data-window="60">1h</button>
                    </div>
                </div>
                <div class="card-actions">
                    <button class="icon-btn" id="reset-zoom-btn" title="Reset Zoom">
                        <i class="fas fa-search-minus"></i>
                    </button>
                    <button class="icon-btn" id="realtime-chart-settings-btn" title="Settings">
                        <i class="fas fa-sliders-h"></i>
                    </button>
                </div>
            </div>
            <div class="card-content chart-content">
                <div id="realtime-chart-container"></div>
            </div>
        </div>
    </div>
</main>
