<!-- Unified Page Partial - Supports both Visualization and Dashboard modes -->
<!-- CSS is loaded dynamically by app.js to ensure proper cascade order -->

<!-- Main Content -->
<main class="unified-page" data-mode="visualization">
    <!-- Dashboard Toolbar (visible in dashboard mode only) -->
    <section class="about-toolbar">
        <!-- Row 1: Dropdowns, title, actions -->
        <div class="about-toolbar-row about-toolbar-top">
            <div class="about-toolbar-left">
                <!-- Project and Flight dropdowns will be relocated here by JS in dashboard mode -->
            </div>
            <h1 class="about-page-title">Dashboard</h1>
            <div class="about-toolbar-right">
                <button class="about-toolbar-btn" id="dashboard-share-btn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
                        <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
                    </svg>
                    SHARE
                </button>
                <button class="about-toolbar-btn about-toolbar-btn--cite" id="dashboard-cite-btn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                    </svg>
                    CITE
                </button>
            </div>
        </div>
        <!-- Row 2: Timeline controls (relocated from footer by JS in dashboard mode) -->
        <div class="about-toolbar-row about-toolbar-timeline" id="dashboard-timeline-host">
        </div>
    </section>

    <!-- Visualization Grid -->
    <div class="viz-grid">
        <!-- Camera Imagery Card -->
        <div class="viz-card camera-card unified-card" data-card="camera">
            <div class="card-header">
                <div class="card-title-group">
                    <div class="card-title-info">
                        <h3 class="card-title">Camera Imagery</h3>
                    </div>
                </div>
                <div class="card-actions">
                    <button class="icon-btn expand-btn" title="Expand view">
                        <i class="fas fa-expand"></i>
                    </button>
                </div>
            </div>
            <div class="card-content video-content">
                <video id="myVideo" playsinline muted>
                    <source src="movies/2" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
            </div>
        </div>

        <!-- Plots Card -->
        <div class="viz-card plots-card unified-card" data-card="plots">
            <div class="card-header">
                <div class="card-title-group">
                    <div class="card-title-info">
                        <h3 class="card-title">Plots</h3>
                    </div>
                </div>
                <div class="card-actions">
                    <button class="icon-btn" id="open-settings-btn" title="Settings">
                        <i class="fas fa-sliders-h"></i>
                    </button>
                    <button class="icon-btn expand-btn" title="Expand view">
                        <i class="fas fa-expand"></i>
                    </button>
                </div>
            </div>
            <div class="card-content charts-content">
                <div id="graph-container" class="charts-grid" data-chart-count="4">
                    <!-- Charts are dynamically created by ChartContainerManager -->
                </div>
            </div>
        </div>

        <!-- Flight Map Card -->
        <div class="viz-card map-card unified-card" data-card="map">
            <div class="card-header">
                <div class="card-title-group">
                    <div class="card-title-info">
                        <h3 class="card-title">Flight Map</h3>
                    </div>
                </div>
                <div class="card-actions">
                    <button class="icon-btn" id="open-map-settings-btn" title="Settings">
                        <i class="fas fa-sliders-h"></i>
                    </button>
                    <button class="icon-btn expand-btn" title="Expand view">
                        <i class="fas fa-expand"></i>
                    </button>
                </div>
            </div>
            <div class="card-content map-content">
                <div id="map"></div>
            </div>
        </div>

        <!-- Variables List Card (Dashboard mode only) -->
        <div class="about-card about-variable-card unified-card dashboard-only-card" data-card="variables">
            <div class="about-card-header">
                <div class="about-card-title-group">
                    <h3 class="about-card-title">Variables List</h3>
                    <span class="about-card-subtitle" id="variables-subtitle"></span>
                </div>
            </div>
            <div class="about-card-body" id="variables-table-container">
                <!-- Variables table will be injected here -->
            </div>
        </div>

        <!-- Projects Table Card (Dashboard mode only) -->
        <div class="about-card about-projects-card unified-card dashboard-only-card" data-card="projects">
            <div class="about-card-header">
                <div class="about-card-title-group">
                    <h3 class="about-card-title">Available Projects</h3>
                </div>
            </div>
            <div class="about-card-body" id="projects-table-container">
                <!-- Projects table will be injected here -->
            </div>
        </div>

        <!-- Variable Selector (Hidden) -->
        <div style="display: none;">
            <select id="variable-select"></select>
        </div>

        <!-- Image Container (Hidden) -->
        <div id="image-container" style="display: none;">
            <div id="F2DS"></div>
            <div id="HVPS"></div>
        </div>
    </div>
</main>

<footer id="footer-controls" class="viz-mode-only">
    <button id="footer-toggle" class="footer-toggle" aria-label="Toggle footer">
        <svg class="footer-toggle-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <polyline points="6 9 12 15 18 9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></polyline>
        </svg>
    </button>
    <div class="footer-controls-inner">
        <!-- Left: Play button and speed dropdown -->
        <div class="footer-left">
            <button id="play-pause-button" class="play-btn" title="Play/Pause">
                <i class="fas fa-play"></i>
            </button>
            <div class="speed-dropdown" id="speed-dropdown">
                <button class="speed-dropdown-trigger" id="speed-trigger">
                    <span class="speed-value">1x</span>
                    <svg class="speed-chevron" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
                </button>
                <div class="speed-dropdown-menu" id="speed-menu">
                    <button class="speed-option" data-speed="0.25">0.25x</button>
                    <button class="speed-option" data-speed="0.5">0.5x</button>
                    <button class="speed-option active" data-speed="1">1x</button>
                    <button class="speed-option" data-speed="2">2x</button>
                    <button class="speed-option" data-speed="4">4x</button>
                </div>
            </div>
        </div>

        <!-- Center: Timeline -->
        <div class="footer-center">
            <div id="timeline-bar">
                <div id="timeline-controls">
                    <div id="timeline-wrapper">
                        <div id="timeline-container">
                            <div id="timeline-track">
                                <!-- Window, handles, playhead, sparkline created by TimelineUI JS -->
                            </div>
                            <div id="timeline-ticks"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right: Project/Flight selector and time display -->
        <div class="footer-right">
            <div class="flight-info-group">
                <!-- Project Dropdown -->
                <div class="footer-dropdown" id="project-dropdown">
                    <button class="footer-dropdown-trigger" id="project-trigger">
                        <span class="dropdown-text" id="project-name-display">GOTHAAM</span>
                        <svg class="footer-chevron" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="6 9 12 15 18 9"></polyline>
                        </svg>
                    </button>
                    <div class="footer-dropdown-menu" id="project-menu">
                        <!-- Options populated by UnifiedPage.js -->
                    </div>
                </div>

                <span class="flight-separator">/</span>

                <!-- Flight Dropdown -->
                <div class="footer-dropdown" id="flight-dropdown">
                    <button class="footer-dropdown-trigger" id="flight-trigger">
                        <span class="dropdown-text" id="flight-name-display">rf01</span>
                        <svg class="footer-chevron" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="6 9 12 15 18 9"></polyline>
                        </svg>
                    </button>
                    <div class="footer-dropdown-menu" id="flight-menu">
                        <!-- Options populated by UnifiedPage.js -->
                    </div>
                </div>
            </div>

            <div class="time-display-group">
                <span id="current-time-display"></span>
            </div>
        </div>
    </div>
</footer>
