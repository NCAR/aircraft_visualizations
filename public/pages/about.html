<!-- About Page Partial -->
<link rel="stylesheet" href="css/about.css">
<!-- Main Content -->
<main class="about-page">
    <!-- Top Toolbar: Dropdowns, Title, Share/Cite -->
    <section class="about-toolbar">
        <div class="about-toolbar-left">
            <div class="custom-dropdown" id="flight-dropdown">
                <button class="custom-dropdown-trigger" id="flight-trigger">
                    <span class="dropdown-text">Select Flight</span>
                    <svg class="dropdown-arrow" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
                </button>
                <div class="custom-dropdown-menu" id="flight-menu">
                    <!-- Populated by AboutPage.js -->
                </div>
            </div>
            <div class="project-dropdown" id="project-dropdown">
                <button class="project-dropdown-trigger" id="project-trigger">
                    <span class="dropdown-text">Select Project</span>
                    <svg class="project-dropdown-arrow" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
                </button>
                <div class="project-dropdown-menu" id="project-menu">
                    <!-- Options populated by AboutPage.js -->
                </div>
            </div>
        </div>
        <h1 class="about-page-title">Information</h1>
        <div class="about-toolbar-right">
            <button class="about-toolbar-btn" id="about-share-btn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
                    <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
                </svg>
                SHARE
            </button>
            <button class="about-toolbar-btn about-toolbar-btn--cite" id="about-cite-btn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                </svg>
                CITE
            </button>
        </div>
    </section>

    <!-- Information Cards Section: Variable List and Projects Table -->
    <section class="about-info-section">
        <div class="about-cards-container">
            <!-- Left Card: Variable List -->
            <div class="about-card about-variable-card">
                <div class="about-card-header">
                    <div class="about-card-title-group">
                        <h3 class="about-card-title">Variables List</h3>
                        <span class="about-card-subtitle" id="variables-subtitle"></span>
                    </div>
                </div>
                <div class="about-card-body" id="variables-table-container">
                    <!-- Variables table will be injected here by VariablesListTable component -->
                </div>
            </div>
            <!-- Right Card: Projects Table -->
            <div class="about-card about-projects-card">
                <div class="about-card-header">
                    <div class="about-card-title-group">
                        <h3 class="about-card-title">Available Projects</h3>
                    </div>
                </div>
                <div class="about-card-body" id="projects-table-container">
                    <!-- Projects table will be injected here by AboutPage.js -->
                </div>
            </div>
        </div>
    </section>
</main>
