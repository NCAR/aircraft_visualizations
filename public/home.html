<div id="video-container">
    <div id="video-title">
        <h2 class="font1"><span id="project-name">TI3GER</span> <span class="font2" id="flight-name">RF01</span></h2>
        <label for="flight-select" class="font1">Select Flight:</label>
        <select id="project-select" class="font2"></select>
        <select id="flight-select" class="font2"></select>
        <label for="variable-select" class="font1">Select Variable:</label>
        <select id="variable-select" class="font2"></select>
    </div>
    <video id="myVideo" controls>
        <source id="videoSource" type="video/mp4">
        Your browser does not support the video tag.
    </video>
    <div id="map">
        <div class="video-overlay">
            <h2><span id="current-time"></span></h2>
        </div>
    </div>
</div>
<div id="overlay">
    <button id="playButton">Play Video</button>
</div>
<main>
    <div id="graph-container">
        <div id="chart1"></div>
        <div id="chart2"></div>
        <div id="chart3"></div>
        <div id="chart4"></div>
    </div>
    <div id="image-container">
        <div id="F2DS"></div>
        <div id="HVPS"></div>
    </div>
</main>
